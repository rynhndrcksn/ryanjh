{% extends "base.html" %}

{% block title %}Tags{% endblock title %}
{% block description %}Browse all tags on ryanjh.com.{% endblock description %}

{% block content %}
<article>
    <h1>Tags</h1>
    <ul>
        {% for term in terms %}
        <li>
            <a href="{{ term.permalink }}">{{ term.name }}</a>
            ({{ term.pages | length }})
        </li>
        {% endfor %}
    </ul>
</article>
{% endblock content %}
