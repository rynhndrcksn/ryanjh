name: Build and Release

on:
    push:
        tags:
            - 'v*'

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Log in to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Extract version from tag
                id: version
                run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            -   name: Build and push
                uses: docker/build-push-action@v5
                with:
                    context: .
                    push: true
                    tags: |
                        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
                    labels: |
                        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                        org.opencontainers.image.revision=${{ github.sha }}
                        org.opencontainers.image.version=${{ steps.version.outputs.version }}

            -   name: Get previous tag
                id: previous_tag
                run: |
                    git fetch --tags
                    echo "tag=$(git tag --sort=-v:refname | grep -v "^${{ steps.version.outputs.version }}$" | head -n 1)" >> $GITHUB_OUTPUT

            -   name: Generate release notes
                id: release_notes
                run: |
                    if [ -n "${{ steps.previous_tag.outputs.tag }}" ]; then
                        NOTES=$(git log ${{ steps.previous_tag.outputs.tag }}..${{ steps.version.outputs.version }} --pretty=format:"- %s (%h)" --no-merges)
                    else
                        NOTES=$(git log ${{ steps.version.outputs.version }} --pretty=format:"- %s (%h)" --no-merges)
                    fi
                    echo "notes<<EOF" >> $GITHUB_OUTPUT
                    echo "$NOTES" >> $GITHUB_OUTPUT
                    echo "EOF" >> $GITHUB_OUTPUT

            -   name: Create GitHub Release
                uses: actions/create-release@v1
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                with:
                    tag_name: ${{ steps.version.outputs.version }}
                    release_name: Release ${{ steps.version.outputs.version }}
                    body: |
                        ## Changes
                        ${{ steps.release_notes.outputs.notes }}
                    draft: false
                    prerelease: false
