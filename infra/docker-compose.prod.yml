# Production yml file for https://www.ryanjh.com
services:
    caddy:
        image: caddy:2-alpine
        container_name: caddy
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro

            # Application files
            - public-volume:/var/www/html/ryanjh:ro
            - ./ryanjh/public/uploads:/var/www/html/ryanjh/uploads:ro

            # Caddy stores its auto-provisioned certs and state here.
            # Must be a named volume — losing this means unnecessary re-issuance.
            - caddy-data:/data
            - caddy-config:/config

            - ./logs/caddy:/var/log/caddy
        depends_on:
            - ryanjh
        networks:
            - app-network

    ryanjh:
        image: ghcr.io/rynhndrcksn/ryanjh:latest
        container_name: ryanjh-app
        restart: unless-stopped
        volumes:
            # Symfony cache, sessions, logs
            - ./ryanjh/var:/app/var

            # Public files
            - public-volume:/app/public

            # User uploads
            - ./ryanjh/public/uploads:/app/public/uploads

            # Environment config
            - ./ryanjh/.env.prod.local:/app/.env.local:ro
        depends_on:
            - postgres
        networks:
            - app-network

    postgres:
        image: postgres:18-alpine
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
        volumes:
            - ./postgres/pg_data:/var/lib/postgresql/data
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    public-volume:
    caddy-data:
    caddy-config:
